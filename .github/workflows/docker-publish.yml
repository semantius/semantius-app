name: Publish Docker image

# Build and push the runtime-configurable image to GitHub Container Registry when
# a release tag is pushed. The image is env-agnostic — no build secrets; all
# config is injected at container start (see docker/README.md).
#
# This workflow also creates the GitHub Release. Pushing a tag does NOT create a
# Release on its own — a tag and a Release are separate objects, and without the
# step below the Releases page stays empty even though the image published fine.
#
# `./release.sh` at the repository root is how a tag gets pushed. Everything the
# `guard` job below checks, that script checks first, so the refusal normally
# arrives before the tag exists. The guard is what makes it true anyway when
# somebody tags by hand.
on:
  push:
    tags:
      # Release and pre-release, and nothing else. A `v`-prefixed tag that is
      # not a version — `v-old`, `vendor-x` — must not start a publish. The
      # previous filter was a bare `v*`, which would have.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse (builds amd64 + arm64, publishes nothing).'
        required: true
        default: v0.1.3

permissions:
  contents: write # needed to create the GitHub Release (read is enough for checkout alone)
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  # Deliberately not `cancel-in-progress`. Cancelling a build is free;
  # cancelling something between "pushed the manifest" and "created the
  # release" leaves a half-published version behind.
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # Fail in thirty seconds rather than at minute fifteen — the arm64 leg builds
  # under QEMU, so the build itself is far too late to notice a bad version.
  # -------------------------------------------------------------------------
  guard:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      version: ${{ steps.derive.outputs.version }}
      prerelease: ${{ steps.derive.outputs.prerelease }}
      publish: ${{ steps.derive.outputs.publish }}
      latest: ${{ steps.derive.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag, not just this ref: whether this version is the newest is
          # decided by comparing it against all the others (see below).
          fetch-depth: 0

      - name: Derive and check the version
        id: derive
        env:
          # Through the environment, never interpolated into the script: a tag
          # name is attacker-controllable in a fork, and `${{ }}` inside a
          # `run:` is textual substitution before the shell ever sees it.
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
            publish=false
          else
            tag="$GITHUB_REF_NAME"
            publish=true
          fi

          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a version tag. Expected vX.Y.Z or vX.Y.Z-<pre>."
            exit 1
          fi

          # The tag is the only record of what an image contains — the SPA
          # reports no version at runtime — so a tree claiming 0.1.0 while the
          # tag claims 0.1.2 makes that record untraceable. The bump belongs in
          # the commit being tagged; `./release.sh` puts it there.
          #
          # Publish-time only. A rehearsal exists to answer "will this build for
          # arm64?" BEFORE the bump commit is written, so enforcing agreement
          # there would fail every rehearsal that is doing its job — and there is
          # no artifact to trace back to anyway, because nothing is pushed.
          core="${version%%-*}"
          declared="$(node -p "require('./package.json').version")"
          if [ "$publish" = "true" ] && [ "$declared" != "$core" ]; then
            echo "::error::package.json says $declared; tag $tag says $core. Bump the version in the commit being tagged (./release.sh does this)."
            exit 1
          fi

          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac

          # Does this version outrank every tag already in the repository?
          #
          # `latest` means the LATEST version, pre-releases included: semver orders
          # 0.4.0 < 0.5.0-beta.1 < 0.5.0, so a beta of 0.5.0 is newer than 0.4.0
          # and must take it. But "newest" cannot be read off the ref alone —
          # cutting the backport v0.4.1 AFTER v0.5.0-beta.1 would then drag
          # `latest` backwards onto it. It is decided by comparison instead,
          # against the full tag list the checkout above fetches.
          #
          # The comparator is tested first, here, because a silent mis-sort
          # mislabels a published image and nothing downstream would notice.
          node --test .github/scripts/latest-tag.test.mjs
          latest=false
          if [ "$publish" = "true" ] && [ "$(node .github/scripts/latest-tag.mjs "$version")" = "true" ]; then
            latest=true
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

          echo "\`$tag\` — version \`$version\`, prerelease \`$prerelease\`, publish \`$publish\`, latest \`$latest\`" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # Lint + unit tests. The steps live in checks.yml so that enabling them on
  # pull requests later is one uncommented trigger there, with nothing copied
  # into a second workflow.
  #
  # Runs beside `guard`, both gating the build, for the same reason `guard` is
  # its own job — failing here costs a minute, failing after the emulated arm64
  # leg costs fifteen.
  # -------------------------------------------------------------------------
  checks:
    uses: ./.github/workflows/checks.yml
    # Explicit, not `secrets: inherit`: a called workflow gets nothing unless it
    # is handed over, and naming the one secret keeps the blast radius of a
    # called workflow to what it declares. The suite needs it to decrypt .env
    # for SEMANTIUS_API_KEY (checks.yml says why).
    secrets:
      DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}

  # The real OAuth login journey (apps/web/e2e/), from a11y.yml. Only that job
  # runs here — `audit` defaults to off on a call, because an hour-long audit
  # that is red by design while criteria remain open is a report, not a gate.
  # The journey is the one place the app's actual login path is proven, which
  # is why it gates what ships; see the trade-off spelled out in a11y.yml.
  a11y:
    uses: ./.github/workflows/a11y.yml
    # Only `login-journey` runs on a call, and it needs no secret. The key is
    # passed anyway so that turning `audit` on from here is one input, not an
    # input plus a secrets line discovered after the run comes back empty.
    secrets:
      DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}

  build-and-push:
    name: image · amd64 + arm64
    runs-on: ubuntu-latest
    # The arm64 leg is emulated and slow, but not six-hours slow — the default
    # timeout would let a wedged QEMU build sit on a runner all afternoon.
    timeout-minutes: 60
    needs: [guard, checks, a11y]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes are generated by diffing against the previous tag

      # Emulate the non-native arch (arm64 on the amd64 runner) so a single job
      # can produce a multi-arch manifest. The arm64 leg builds under QEMU, so it
      # is slower than the amd64 leg — that's the trade-off for one-runner builds.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # github.repository (Owner/Repo) is lowercased for GHCR by this action.
          images: ghcr.io/${{ github.repository }}
          # `value=` rather than the ref, so a dispatched rehearsal derives the
          # same tag set from its input that a tag derives from itself.
          #
          # `{{major}}.{{minor}}` and `{{major}}` are skipped for a pre-release:
          # `0.2` names the released 0.2 line, and 0.2.0-rc.1 is not in it yet.
          # `{{major}}` is additionally skipped by the action itself while the
          # major version is zero. `latest` is NOT in that list — see the flavor
          # block below, which gives it to every published tag including a
          # pre-release, because a pre-release of a higher version is a higher
          # version.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.guard.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.guard.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.guard.outputs.tag }}
            type=sha,prefix=sha-,format=short
          # `latest` means the LATEST version, prereleases included: semver
          # orders 0.4.0 < 0.5.0-beta < 0.5.0, so a beta of 0.5.0 is newer than
          # 0.4.0 and `latest` pointing at 0.4.0 would be pointing backwards.
          # This is deliberately NOT docker/metadata-action's default opinion
          # ("pre-release … only extend {{version}} … not yet fit for public
          # consumption"), which is why it is spelled out rather than left to
          # `latest=auto`.
          #
          # The action only ever sees the ref being built — it cannot compare
          # against tags already published — so this is "the tag being pushed
          # takes latest", which equals "highest version" only while releases
          # are cut in ascending order. A backport cut after a higher tag
          # (v0.2.10 landing after v0.3.0) would move `latest` BACKWARDS. If
          # that ever becomes a real workflow, latest has to be resolved by
          # querying the registry instead of derived here.
          #
          # Still never `type=raw,value=latest`: on a manual dispatch there is
          # no tag, and that would hand `latest` to whatever branch was run.
          flavor: |
            latest=${{ needs.guard.outputs.latest }}

      - name: Log in to GitHub Container Registry
        if: needs.guard.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A dispatch rehearses and never publishes: it answers "will v0.1.3 build
      # for arm64?" before there is a tag to answer it badly. Nothing is
      # exported — `load` cannot take two architectures, and a registry push is
      # the one thing a rehearsal must not do — but the layers land in the GHA
      # cache, so the real tag build reuses them.
      - name: Build both architectures (no push)
        if: needs.guard.outputs.publish != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push
        if: needs.guard.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise what was published
        if: needs.guard.outputs.publish == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo
            printf '%s\n' "$TAGS" | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        if: needs.guard.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.guard.outputs.tag }}
          prerelease: ${{ needs.guard.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## Docker image

            Published to GitHub Container Registry (multi-arch: `linux/amd64` + `linux/arm64`):

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.guard.outputs.version }}
            docker run -p 7070:80 --env-file docker/.env ghcr.io/${{ github.repository }}:${{ needs.guard.outputs.version }}
            ```

            Runtime-configured at container start — see
            [docker/README.md](https://github.com/${{ github.repository }}/blob/main/docker/README.md).

            ---
