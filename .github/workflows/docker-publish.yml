name: Publish Docker image

# Build and push the runtime-configurable image to GitHub Container Registry when
# a release tag (v*) is pushed. The image is env-agnostic — no build secrets; all
# config is injected at container start (see docker/README.md).
#
# This workflow also creates the GitHub Release. Pushing a tag does NOT create a
# Release on its own — a tag and a Release are separate objects, and without the
# step below the Releases page stays empty even though the image published fine.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write # needed to create the GitHub Release (read is enough for checkout alone)
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes are generated by diffing against the previous tag

      # Emulate the non-native arch (arm64 on the amd64 runner) so a single job
      # can produce a multi-arch manifest. The arm64 leg builds under QEMU, so it
      # is slower than the amd64 leg — that's the trade-off for one-runner builds.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # github.repository (Owner/Repo) is lowercased for GHCR by this action.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runs only for tag pushes — a manual workflow_dispatch has no tag to
      # release, and steps.meta.outputs.version would not be a semver.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Docker image

            Published to GitHub Container Registry (multi-arch: `linux/amd64` + `linux/arm64`):

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
            docker run -p 7070:80 --env-file docker/.env ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
            ```

            Also tagged `latest`. Runtime-configured at container start — see
            [docker/README.md](https://github.com/${{ github.repository }}/blob/main/docker/README.md).

            ---
