name: Accessibility

# The two real-browser checks that `pnpm check` cannot carry, defined once and
# called from anywhere — the same rule as checks.yml.
#
#   login-journey  Everything in apps/web/e2e/: the interactive OAuth round trip,
#                  the only place the app's real login path runs (and what keeps
#                  the suite's session seeding honest), plus the transient-failure
#                  contract — a 429 or a cold-start 404 must never reach the user
#                  as text. Two builds and seven Playwright tests: cheap enough to
#                  GATE a release, and docker-publish.yml calls it beside
#                  checks.yml for exactly that. The trade-off is deliberate: it
#                  depends on test-oidc-server.ma532.workers.dev answering and on
#                  the tenant being up, so an outage in either blocks a release.
#                  That is the right failure — a build whose login cannot be
#                  proven should not ship — and both live in the same account as
#                  the previews.
#
#   audit          scripts/a11y-audit/ against a Cloudflare preview deployed from
#                  the same commit. It decrypts the committed .env
#                  (DOTENV_PRIVATE_KEY is already a repository secret) for the
#                  Cloudflare token and the tenant API key, takes about forty
#                  minutes, and exits 1 by design while any criterion is still
#                  Partially Supports or any cell is INCONCLUSIVE. It REPORTS:
#                  the run's JSON is the artifact and the job status is the
#                  headline. It does not gate a release — a gate that is red for
#                  a known reason teaches everyone to click past it.
on:
  workflow_dispatch:
    inputs:
      audit:
        description: 'Deploy a preview of this commit and run the route audit against it'
        type: boolean
        default: true
      label:
        description: 'Artifact label: a11y-reports/<stamp>-<label>.json'
        type: string
        default: ci
  # No schedule. The audit deploys a preview, needs the tenant up, takes over an
  # hour and is red by design while criteria are open — a timer would spend all
  # of that with nobody waiting for the answer. Dispatch it when a run is wanted.
  workflow_call:
    inputs:
      audit:
        type: boolean
        default: false
      label:
        type: string
        default: ci
    secrets:
      # Both jobs need it now: `audit` for the Cloudflare token, and the e2e job
      # for the tenant API key its `tenant` project mints a session with. A
      # called workflow receives no secrets unless the caller passes them.
      DOTENV_PRIVATE_KEY:
        description: 'Decrypts the committed .env: the tenant API key for the e2e run, plus the Cloudflare token for the audit.'
        required: true

jobs:
  login-journey:
    name: e2e · real login, real failures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @semantius/frontend test:e2e:install

      # Two builds, two projects (playwright.config.ts): `chromium` drives the
      # interactive login against the OIDC test server, and `tenant` injects
      # transient failures into the REAL tenant's endpoints — which needs
      # SEMANTIUS_API_KEY to mint a session, hence dotenvx and the key below.
      - name: Login journey and transient failures
        env:
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
        run: pnpm --filter @semantius/frontend test:e2e

      - name: Keep the trace of a failed journey
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-journey-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: route audit · deployed preview
    # On dispatch the input defaults to true; on a call it defaults to false.
    if: ${{ inputs.audit }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LABEL: ${{ inputs.label || 'ci' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: pnpm

      # The same provisioning every agent sandbox gets — agent-browser, dotenvx
      # and wrangler globally, Playwright's Chromium, then `pnpm install` — from
      # the one script that defines it, so a runner cannot drift from the
      # sandboxes the audit is developed in.
      - name: Provision the audit's tooling
        env:
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
        run: bash workplace/setup.sh

      # The audit must measure the build under review, and the `#jwt` session
      # seeding it relies on is gated to *.workers.dev hosts, so a preview is
      # the only place it can run. Writing .preview-url.md is the deploy
      # script's last step; its absence is the deploy-failed signal.
      - name: Deploy a preview of this commit
        env:
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
        run: |
          dotenvx run -- bash workplace/deploy-wrangler.sh
          test -f .preview-url.md || { echo "::error::the preview deploy did not write .preview-url.md"; exit 1; }

      - name: Audit
        env:
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
        run: |
          url="$(grep -oE 'https://\S+' .preview-url.md)"
          echo "Audited $url" >> "$GITHUB_STEP_SUMMARY"
          dotenvx run -- node scripts/a11y-audit/run.mjs --url "$url" --label "$LABEL" --screenshots

      # Kept whether or not the audit passed: a failing run is the one somebody
      # needs to read. Cite a run by its timestamped filename — the git-ignored
      # latest.json is a local convenience, not a record.
      - name: Keep the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            a11y-reports
            !a11y-reports/latest.json
            .preview-url.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Digest
        if: always()
        run: |
          latest="$(ls -t a11y-reports/*-"$LABEL".txt 2>/dev/null | head -1)"
          if [ -n "$latest" ]; then
            { echo '```'; cat "$latest"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
