# Replaces the image's /etc/nginx/conf.d/default.conf. Serves the Vite build as
# a single-page app (matching the Cloudflare `single-page-application` behavior).
# This image is SPA-only: no reverse proxy, no /api or /api-docs routes — the SPA
# talks to whatever absolute VITE_API_BASE_URL it is configured with.
server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Runtime config + entry HTML must never be cached — config.js is generated
    # per container start and index.html references hashed asset filenames.
    # (No `expires` directive here: it would emit a second, conflicting
    # Cache-Control: no-cache header alongside this explicit one.)
    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate" always;
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Vite emits content-hashed files under /assets/ — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Operator-supplied translation catalogs (see the app's Internationalization
    # docs). Mount a volume or copy files here to add a language without a
    # rebuild; register each one in VITE_UI_CUSTOMIZER's `locales` section.
    #
    # `try_files $uri =404` is load-bearing, NOT tidiness: without it a missing
    # or misspelled file falls through to the SPA fallback below and answers the
    # app's own index.html with a 200, so the browser would hand a page of HTML
    # to JSON.parse. The app also checks the content-type for exactly this
    # reason, but an honest 404 is what makes a typo readable in the network tab.
    #
    # no-cache rather than immutable: these filenames are not content-hashed, and
    # an operator editing a translation expects a reload to show it.
    location /locales/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths (client-side routes) serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
